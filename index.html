<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="The UV index where you are, as a colour on the map. Green means go out; violet means stay in."
        />
        <meta name="theme-color" content="#f8fafc" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src https://air-quality-api.open-meteo.com; base-uri 'none'; object-src 'none';"
        />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>☀️</text></svg>"
            type="image/svg+xml"
        />
        <title>Safe Sun Map</title>

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />

        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <div id="map" role="application" aria-label="World map showing your location"></div>

        <!-- The answer. A wash over the whole viewport rather than a shape on
             the map, because the reading is about the visitor, not about a
             region — and because a viewport-sized element cannot be panned
             out of view. -->
        <div id="veil" aria-hidden="true"></div>

        <main id="card" aria-live="polite">
            <div id="reading" hidden>
                <p id="uv-label" class="card-label">UV index</p>
                <p class="card-headline">
                    <span id="uv-value">—</span>
                    <span id="uv-band"></span>
                </p>
                <p id="uv-advice" class="card-advice"></p>
                <p id="clock" class="card-clock"></p>
            </div>

            <div id="status" class="card-status">
                <p id="status-text"></p>
                <button type="button" id="retry" class="retry" hidden>Retry</button>
            </div>
        </main>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
