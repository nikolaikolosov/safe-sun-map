<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="The UV index where you are, as a colour on the map. Green means go out; violet means stay in."
        />
        <meta name="theme-color" content="#f8fafc" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src https://air-quality-api.open-meteo.com; base-uri 'none'; object-src 'none';"
        />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>☀️</text></svg>"
            type="image/svg+xml"
        />
        <title>Safe Sun Map</title>

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />

        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <div
            id="map"
            role="application"
            aria-label="World map showing your location"
            data-i18n-aria="a11y.map"
        >
            <!-- The answer. A wash over the whole viewport rather than a shape
                 on the map, because the reading is about the visitor, not about
                 a region — and because a viewport-sized element cannot be
                 panned out of view.
                 It lives INSIDE the map container so it can be stacked between
                 Leaflet's tiles and Leaflet's controls; see css/styles.css.
                 Leaflet appends its own panes alongside it and leaves it
                 alone. -->
            <div id="veil" aria-hidden="true"></div>
        </div>

        <main id="card" aria-live="polite">
            <!-- The label stays up in every state: it titles the card, so it
                 reads correctly above a status line as well as above a
                 reading — which is what keeps the switcher on one row with
                 something, instead of on a row of its own. -->
            <div class="card-head">
                <p id="uv-label" class="card-label" data-i18n="label.uv">UV index</p>
                <div
                    class="lang-switcher"
                    role="group"
                    aria-label="Change language"
                    data-i18n-aria="lang.groupAria"
                >
                    <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
                    <button type="button" class="lang-btn" data-lang="es" lang="es">ES</button>
                    <button type="button" class="lang-btn" data-lang="ru" lang="ru">RU</button>
                </div>
            </div>

            <div id="reading" hidden>
                <p class="card-headline">
                    <span id="uv-value">—</span>
                    <span id="uv-band"></span>
                </p>
                <p id="uv-advice" class="card-advice"></p>
                <p id="clock" class="card-clock"></p>
            </div>

            <div id="status" class="card-status">
                <p id="status-text"></p>
                <button type="button" id="retry" class="retry" data-i18n="status.retry" hidden>
                    Retry
                </button>
            </div>
        </main>

        <!-- Bottom-left, the one corner the map controls leave empty. Chrome
             like the card, so it sits at the card's layer and the wash passes
             underneath it. The label is on the inner span, not the anchor:
             `applyTranslations` replaces textContent, which would take the
             heart with it. -->
        <a
            class="support"
            href="https://ko-fi.com/nikolaikolosov"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Support the author on Ko-fi (opens in a new tab)"
            title="Support the author on Ko-fi (opens in a new tab)"
            data-i18n-aria="support.aria"
            data-i18n-title="support.aria"
        >
            <span class="support-heart" aria-hidden="true">❤️</span>
            <span data-i18n="support.label">Support the author</span>
        </a>

        <!-- Help sheet, opened by the ⓘ control on the map. A native <dialog>:
             focus trapping, Esc-to-close and an inert page behind it all come
             with the element. -->
        <dialog id="help" aria-labelledby="help-title">
            <div class="help-head">
                <h2 id="help-title" data-i18n="help.title">The UV index</h2>
                <button
                    type="button"
                    id="help-close"
                    class="help-close"
                    aria-label="Close"
                    data-i18n-aria="help.close"
                >
                    ×
                </button>
            </div>

            <p data-i18n="help.what">
                Shows the level of the sun's ultraviolet radiation at ground level.
            </p>

            <h3 data-i18n="help.levels">Levels</h3>
            <!-- Rows are generated from the band table in src/uv.js, so the
                 legend cannot drift from the colours the map actually uses. -->
            <ul id="help-levels" class="help-levels"></ul>

            <p data-i18n="help.effect">
                Ultraviolet causes burns and, over the years, ageing of the skin and a raised risk
                of melanoma.
            </p>

            <p class="help-source" data-i18n="help.source">
                Readings from Open-Meteo. Scale: the WHO/WMO Global Solar UV Index.
            </p>
        </dialog>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
